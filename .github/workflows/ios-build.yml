name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Show Xcode project
        run: |
          ls -la ios
          find ios -maxdepth 1 -name "*.xcworkspace" -print
          find ios -maxdepth 1 -name "*.xcodeproj" -print

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace ios/BasaMessenger.xcworkspace \
            -scheme "BasaMessenger" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BasaMessenger.app Payload/BasaMessenger.app
          zip -r Basa-Messenger-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Basa-Messenger-IPA
          path: Basa-Messenger-unsigned.ipa
