name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Inspect iOS project
        run: |
          echo "=== iOS directory ==="
          ls -la ios

          echo "=== Workspaces ==="
          find ios -maxdepth 1 -name "*.xcworkspace" -print

          echo "=== Projects ==="
          find ios -maxdepth 1 -name "*.xcodeproj" -print

      - name: Show Xcode schemes
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" -print -quit)

          if [ -n "$WORKSPACE" ]; then
            echo "Using workspace: $WORKSPACE"
            xcodebuild -workspace "$WORKSPACE" -list
          elif [ -n "$PROJECT" ]; then
            echo "Using project: $PROJECT"
            xcodebuild -project "$PROJECT" -list
          else
            echo "ERROR: No Xcode workspace or project found"
            exit 1
          fi
