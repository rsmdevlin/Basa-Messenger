services:
  - type: web
    name: basa-messenger-api
    runtime: node
    plan: free
    buildCommand: cd artifacts/api-server && npm run build
    startCommand: cd artifacts/api-server && NODE_ENV=production node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        scope: build
      - key: JWT_SECRET
        scope: build
      - key: CORS_ORIGIN
        value: "*"
